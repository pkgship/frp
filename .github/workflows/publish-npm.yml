name: Publish frp to npm

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-frp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      # Authenticated so the release lookup uses the 5000/hour quota instead of
      # the anonymous 60/hour one (which returns HTTP 403 once exhausted).
      - name: Sync packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync.mjs

      # Platform packages come first, and a version that appeared on the
      # registry in the meantime is left alone.
      - name: Publish packages
        run: |
          while IFS=$'\t' read -r dir name version; do
            if npm view "${name}@${version}" version >/dev/null 2>&1 </dev/null; then
              echo "already published: ${name}@${version}"
            else
              npm publish "publish/${dir}" --access public --provenance </dev/null
            fi
          done < publish/.packages
