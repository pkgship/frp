name: Build Debian Packages

on:
  schedule:
    - cron: '3 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  UPSTREAM_REPO: fatedier/frp

jobs:
  # ── Resolve version ────────────────────────────────────────────────────
  # Compare upstream latest release with this repo's; build when different.
  resolve:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      build: ${{ steps.resolve.outputs.build }}
    steps:
      - name: Resolve
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Poll upstream latest release
          UPSTREAM=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest")
          UPSTREAM_TAG=$(echo "${UPSTREAM}" | jq -r '.tag_name')

          if [ -z "${UPSTREAM_TAG}" ] || [ "${UPSTREAM_TAG}" = "null" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Failed to fetch upstream release"
            exit 0
          fi

          # Compare with this repo's latest release
          THIS=$(curl -sS -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest")
          THIS_TAG=$(echo "${THIS}" | jq -r '.tag_name // ""')

          echo "upstream=${UPSTREAM_TAG}  this=${THIS_TAG}"

          if [ "${UPSTREAM_TAG}" = "${THIS_TAG}" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Already up-to-date"
          else
            echo "build=true"               >> "$GITHUB_OUTPUT"
            echo "tag=${UPSTREAM_TAG}"      >> "$GITHUB_OUTPUT"
            echo "version=${UPSTREAM_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "New upstream release → ${UPSTREAM_TAG}"
          fi

  # ── Build web UI (once, shared by all architectures) ──────────────────
  build-web:
    name: Build web assets
    needs: resolve
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build
        run: |
          make -C web/frps build
          make -C web/frpc build

      - name: Upload web assets
        uses: actions/upload-artifact@v7
        with:
          name: web-assets
          path: |
            web/frps/dist
            web/frpc/dist

  # ── Build debs (one job per architecture) ─────────────────────────────
  build-deb:
    name: Build deb (${{ matrix.debarch }})
    needs: [resolve, build-web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
            debarch: amd64
          - goarch: arm64
            debarch: arm64
          - goarch: arm
            goarm: '7'
            debarch: armhf
          - goarch: '386'
            debarch: i386

    steps:
      - name: Checkout upstream
        uses: actions/checkout@v7
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download web assets
        uses: actions/download-artifact@v8
        with:
          name: web-assets
          path: web

      - name: Compile
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build -trimpath -ldflags "-s -w" -tags frps -o frps ./cmd/frps
          go build -trimpath -ldflags "-s -w" -tags frpc -o frpc ./cmd/frpc

      - name: Package
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          DEBARCH: ${{ matrix.debarch }}
        run: |
          set -euo pipefail

          # ── frpc ────────────────────────────────────────────
          PKG="frpc_${VERSION}_${DEBARCH}"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/bin" "${PKG}/etc/frp" \
                   "${PKG}/lib/systemd/system" "${PKG}/usr/share/doc/frpc"

          cp frpc "${PKG}/usr/bin/frpc"
          chmod 755 "${PKG}/usr/bin/frpc"
          cp conf/frpc.toml "${PKG}/etc/frp/"
          cp LICENSE "${PKG}/usr/share/doc/frpc/copyright"

          cat > "${PKG}/lib/systemd/system/frpc.service" <<'SVC'
          [Unit]
          Description=frp client
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/frpc -c /etc/frp/frpc.toml
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SVC

          cat > "${PKG}/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ]; then
            systemctl stop frpc 2>/dev/null || true
            systemctl disable frpc 2>/dev/null || true
          fi
          PRERM
          chmod 755 "${PKG}/DEBIAN/prerm"

          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: frpc
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEBARCH}
          Maintainer: fatedier <fatedier@gmail.com>
          Description: Client of frp, a fast reverse proxy.
           frpc is the client side of frp, a fast reverse proxy that allows
           you to expose a local server behind a NAT or firewall to the internet.
          Homepage: https://github.com/fatedier/frp
          CTRL

          printf '/etc/frp/frpc.toml\n' > "${PKG}/DEBIAN/conffiles"
          dpkg-deb --build "${PKG}"

          # ── frps ────────────────────────────────────────────
          PKG="frps_${VERSION}_${DEBARCH}"
          mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/bin" "${PKG}/etc/frp" \
                   "${PKG}/lib/systemd/system" "${PKG}/usr/share/doc/frps"

          cp frps "${PKG}/usr/bin/frps"
          chmod 755 "${PKG}/usr/bin/frps"
          cp conf/frps.toml "${PKG}/etc/frp/"
          cp LICENSE "${PKG}/usr/share/doc/frps/copyright"

          cat > "${PKG}/lib/systemd/system/frps.service" <<'SVC'
          [Unit]
          Description=frp server
          After=network.target
          [Service]
          Type=simple
          ExecStart=/usr/bin/frps -c /etc/frp/frps.toml
          Restart=on-failure
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
          SVC

          cat > "${PKG}/DEBIAN/prerm" <<'PRERM'
          #!/bin/sh
          set -e
          if [ "$1" = "remove" ]; then
            systemctl stop frps 2>/dev/null || true
            systemctl disable frps 2>/dev/null || true
          fi
          PRERM
          chmod 755 "${PKG}/DEBIAN/prerm"

          cat > "${PKG}/DEBIAN/control" <<CTRL
          Package: frps
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: ${DEBARCH}
          Maintainer: fatedier <fatedier@gmail.com>
          Description: Server of frp, a fast reverse proxy.
           frps is the server side of frp, a fast reverse proxy that allows
           you to expose a local server behind a NAT or firewall to the internet.
          Homepage: https://github.com/fatedier/frp
          CTRL

          printf '/etc/frp/frps.toml\n' > "${PKG}/DEBIAN/conffiles"
          dpkg-deb --build "${PKG}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: debs-${{ needs.resolve.outputs.version }}-${{ matrix.debarch }}
          path: '*.deb'

  # ── Publish release ───────────────────────────────────────────────────
  publish:
    name: Publish release
    needs: [resolve, build-deb]
    if: needs.resolve.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download all debs
        uses: actions/download-artifact@v8
        with:
          pattern: debs-${{ needs.resolve.outputs.version }}-*
          merge-multiple: true
          path: debs

      - name: Download upstream source tarball
        run: |
          TAG="${{ needs.resolve.outputs.tag }}"
          URL="https://github.com/${{ env.UPSTREAM_REPO }}/archive/refs/tags/${TAG}.tar.gz"
          curl -sSL -o "frp-${TAG}-source.tar.gz" "${URL}"
          echo "Downloaded source: $(du -h "frp-${TAG}-source.tar.gz" | cut -f1)"

      - name: Create / update release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: ${{ needs.resolve.outputs.tag }}
          body: |
            Automated build of [fatedier/frp @ ${{ needs.resolve.outputs.tag }}](https://github.com/${{ env.UPSTREAM_REPO }}/releases/tag/${{ needs.resolve.outputs.tag }}).

            Includes `.deb` packages for **frpc** and **frps** on amd64, arm64, armhf, and i386.
          files: |
            debs/*.deb
            frp-*-source.tar.gz
          fail_on_unmatched_files: false
